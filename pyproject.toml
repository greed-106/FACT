[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fact"
version = "0.1.0"
description = "FACT: a world-action model for robot policy learning on RoboTwin — joint video/action prediction fine-tuned from Wan2.2-TI2V-5B"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.13.0",
  "av==15.1.0",
  "datasets==4.8.4",
  "deepdiff>=7.0.1,<9.0.0",
  "diffusers==0.36.0",
  "draccus==0.10.0",
  "einops",
  "ftfy",
  "gymnasium==0.29.1",
  "h5py==3.16.0",
  "hf-transfer",
  "huggingface-hub[cli]==0.34.4",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "ipywidgets==8.1.9",
  "jsonlines",
  "lerobot==0.3.2",
  "matplotlib==3.10.9",
  "mplib==0.2.1",
  "networkx==3.4.2",
  "numpydantic",
  "numpy==1.26.4",
  "numpy-quaternion==2024.0.13",
  "nvidia-curobo==0.7.2",
  "nvidia-ml-py",
  "open3d==0.18.0",
  "opencv-python==4.10.0.84",
  "pandas",
  "peft==0.19.0",
  "pillow==12.0.0",
  "psutil",
  "pyarrow",
  "pybind11==3.1.0",
  "pydantic",
  "pyyaml==6.0.3",
  "rich==14.2.0",
  "sapien==3.0.0b1",
  "scikit-image==0.25.2",
  "scipy==1.15.3",
  "sentencepiece",
  "setuptools==79.0.1",
  "setuptools-scm==10.2.1",
  "termcolor==2.5.0",
  "toppra==0.6.9",
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "tqdm==4.68.3",
  "transformers==4.51.3",
  "transforms3d==0.4.2",
  "trimesh==4.4.3",
  "tyro",
  "wandb==0.23.1",
  "warp-lang==1.16.0",
  "wheel==0.48.0",
  "yourdfpy==0.0.60",
]

[tool.uv]
# FACT only imports LeRobot's dataset reader. Its published dependency list
# includes teleoperation and visualization packages that this project does not
# use, and conflicts with FACT's datasets==4.8.4. Empty metadata is the uv
# equivalent of FACT's previous deliberate isolated LeRobot install.
dependency-metadata = [{ name = "lerobot", version = "0.3.2", requires-dist = [] }]
# FACT's Wan model stack requires the newer Hub APIs declared by its pinned
# Diffusers and Transformers versions. RoboTwin-Phys does not use Hub during
# local rollouts, so this WAM-only package is intentionally kept at 0.34.4.
# CuRobo builds its CUDA extensions against FACT's synchronized PyTorch wheel.
no-build-isolation-package = ["nvidia-curobo"]
extra-build-dependencies = { nvidia-curobo = ["torch==2.7.1+cu128"] }
extra-build-variables = { nvidia-curobo = { SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NVIDIA_CUROBO = "0.7.2" } }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
nvidia-curobo = { git = "https://github.com/NVlabs/curobo.git", tag = "v0.7.2" }

[tool.setuptools.packages.find]
# scripts/evaluation are packaged so the documented entrypoints also resolve
# when FACT is synchronized as a project. Drop them if the generic top-level
# names are a problem in your environment.
include = ["world_action_model*", "fact_train*", "fact_datasets*", "scripts*", "evaluation*"]

[tool.setuptools.package-data]
# Launcher resolves accelerate_configs relative to __file__, so they must ship.
"fact_train.distributed" = ["accelerate_configs/*.json"]
"evaluation.robotwin" = ["*.yml", "*.sh", "*.patch"]
